version: "3.9"

services:
  springmvc-dev:
    build:
      context: .
      dockerfile: Dockerfile-dev
    container_name: springmvc_dev
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: sqlite
      JWT_SECRET: 0b7406ebe160db49f9324f78cc8bf60d
      JWT_EXPIRATION: 3600000
      SERVER_PORT: 8080
      X_API_KEY: 4133f6c5a711bf720d8f0c817fb19897
    depends_on:
      - kafka
    volumes:
      - ./src:/app/src
      - ./db/migration:/app/db/migration
      - ./data:/data
    command: mvn spring-boot:run -Dspring-boot.run.profiles=sqlite

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: -1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1