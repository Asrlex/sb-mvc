version: "3.9"
services:
  springmvc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: springmvc_app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: springmvc
      DB_USER: appuser
      DB_PASSWORD: apppass
      JWT_SECRET: "prodsecretjwt"
      JWT_EXPIRATION: "3600000"
      X_API_KEY: "prodapikey"
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: springmvc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migration:/app/db/migration
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.1
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: springmvc
      KC_DB_USERNAME: appuser
      KC_DB_PASSWORD: apppass
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
