server.port=${SERVER_PORT:8080}
spring.application.name=springmvc-prod

spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:springmvc}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.cache.type=redis
spring.data.redis.host=redis
spring.data.redis.port=6379

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/springmvc


